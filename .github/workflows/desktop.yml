# Builds the Auduio desktop app for macOS (universal .dmg), Windows (.msi + NSIS .exe)
# and Linux (.deb only; no AppImage), including the native audio engine sidecar that hosts plugins
# (apps/engine-rs: Rust, VST3 + CLAP, permissive dependencies only, licence-gated with cargo-deny).
# Every platform ships the Rust engine (no JUCE code anywhere in the repo). THIRD-PARTY-NOTICES.txt is regenerated on every run and ships
# inside the app (About > Licences). The engine is built first and bundled through tauri.conf.json -> bundle.externalBin
# (binaries/auduio-engine-<target-triple>). On a pushed tag like v0.3.1 it drafts a GitHub Release
# with all installers attached; on manual runs it just uploads workflow artifacts.
#
# Expected repo layout (see README): web app source in ./web-src (built with
# `node tools/build.mjs` into ./web-src/dist) and this shell in ./apps.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust engine everywhere (Linux verified with real plugins; Windows and macOS build, link and self-test on
          # every run). No Audio Units on macOS: VST3 and CLAP only.
          - platform: windows-latest
            args: ''
            engine_triples: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: --target universal-apple-darwin
            engine_triples: universal-apple-darwin aarch64-apple-darwin x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles deb
            engine_triples: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/src-tauri -> target
            apps/engine-rs -> target

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
          # native audio engine: ALSA
          sudo apt-get install -y libasound2-dev

      - name: Engine licence gate (cargo-deny, permissive licences only)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: apps/engine-rs
        shell: bash
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check licenses bans sources

      - name: Desktop shell licence gate (cargo-deny, src-tauri)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: apps/src-tauri
        shell: bash
        run: cargo deny check licenses bans sources

      - name: Build native audio engine (Rust; VST3 + CLAP host)
        shell: bash
        working-directory: apps/engine-rs
        run: |
          if [ "${{ matrix.platform }}" = macos-latest ]; then
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
            mkdir -p target/release
            lipo -create -output target/release/auduio-engine target/aarch64-apple-darwin/release/auduio-engine target/x86_64-apple-darwin/release/auduio-engine
          else
            cargo build --release
          fi
          cargo test --release

      - name: Engine self-test (Rust engine, protocol, no plugins needed)
        shell: bash
        run: |
          exe=engine-rs/target/release/auduio-engine
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          printf '{"id":1,"cmd":"hello"}\n{"id":2,"cmd":"plugins.list"}\n{"id":3,"cmd":"quit"}\n' | AUDUIO_ENGINE_DATA="$RUNNER_TEMP/auduio-rs" "$exe" | tee engine-rs-selftest.txt
          grep -q '"id":1,"ok":true' engine-rs-selftest.txt
          grep -q '"id":3,"ok":true' engine-rs-selftest.txt

      - name: Bundle the engine
        shell: bash
        run: node scripts/place-engine.mjs ${{ matrix.engine_triples }}

      - name: Install
        run: npm ci || npm install

      - name: Third-party notices (Rust crates, Capacitor, Android libraries, fonts)
        shell: bash
        run: node scripts/gen-notices.mjs

      - name: Build web app into apps/web
        run: node scripts/sync-web.mjs ../web-src

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS signing / notarization (optional; unsigned builds work but Gatekeeper warns) ---
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                 # base64 .p12
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}       # "Developer ID Application: ..."
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                       # app-specific password
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --- Windows code signing (optional; unsigned builds trigger SmartScreen) ---
          # Configure bundle.windows.certificateThumbprint / signCommand in tauri.conf.json.
        with:
          projectPath: apps
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Auduio {0}', github.ref_name) || '' }}
          releaseBody: 'Desktop installers for Auduio. macOS: open the .dmg. Windows: run the .msi or -setup.exe. Linux (Debian/Ubuntu): .deb. The desktop app loads VST3 and CLAP plugins on all three platforms: open the browser sidebar, Plugins, Scan. Third-party licences: About > Licences in the app. VST is a trademark of Steinberg Media Technologies GmbH, registered in Europe and other countries.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: auduio-${{ matrix.platform }}
          path: |
            apps/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/src-tauri/target/**/release/bundle/msi/*.msi
            apps/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: ignore
