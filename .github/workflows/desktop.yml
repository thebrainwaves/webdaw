# Builds the Auduio desktop app for macOS (universal .dmg), Windows (.msi + NSIS .exe)
# and Linux (.deb + .AppImage), including the native audio engine sidecar (apps/engine, JUCE C++)
# that hosts VST3 (and AU on macOS) plugins. The engine is built with CMake first and bundled
# through tauri.conf.json -> bundle.externalBin (binaries/auduio-engine-<target-triple>). On a pushed tag like v0.3.1 it drafts a GitHub Release
# with all installers attached; on manual runs it just uploads workflow artifacts.
#
# Expected repo layout (see README): web app source in ./web-src (built with
# `node tools/build.mjs` into ./web-src/dist) and this shell in ./apps.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            engine_cmake: '-A x64'
            engine_triples: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: --target universal-apple-darwin
            engine_cmake: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
            engine_triples: universal-apple-darwin aarch64-apple-darwin x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
            engine_cmake: '-G Ninja'
            engine_triples: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/src-tauri -> target

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
          # native audio engine (JUCE): ALSA, fonts, X11 for plugin editor windows
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: apps/engine/build/_deps
          key: juce-8.0.12-${{ matrix.platform }}

      - name: Build native audio engine (JUCE, VST3/AU host)
        shell: bash
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.engine_cmake }}
          cmake --build engine/build --config Release --parallel
          node scripts/place-engine.mjs ${{ matrix.engine_triples }}

      - name: Engine self-test (protocol, no plugins needed)
        shell: bash
        run: |
          exe=engine/build/auduio-engine_artefacts/Release/auduio-engine
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          printf '{"id":1,"cmd":"hello"}\n{"id":2,"cmd":"plugins.list"}\n{"id":3,"cmd":"quit"}\n' | AUDUIO_ENGINE_DATA="$RUNNER_TEMP/auduio" "$exe" | tee engine-selftest.txt
          grep -q '"id":1,"ok":true' engine-selftest.txt

      - name: Install
        run: npm ci || npm install

      - name: Build web app into apps/web
        run: node scripts/sync-web.mjs ../web-src

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS signing / notarization (optional; unsigned builds work but Gatekeeper warns) ---
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                 # base64 .p12
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}       # "Developer ID Application: ..."
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                       # app-specific password
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --- Windows code signing (optional; unsigned builds trigger SmartScreen) ---
          # Configure bundle.windows.certificateThumbprint / signCommand in tauri.conf.json.
        with:
          projectPath: apps
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Auduio {0}', github.ref_name) || '' }}
          releaseBody: 'Desktop installers for Auduio. macOS: open the .dmg. Windows: run the .msi or -setup.exe. Linux: .deb or .AppImage (chmod +x). The desktop app can load VST3 plugins (and AU on macOS): open the browser sidebar, Plugins, Scan.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: auduio-${{ matrix.platform }}
          path: |
            apps/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/src-tauri/target/**/release/bundle/msi/*.msi
            apps/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/src-tauri/target/**/release/bundle/deb/*.deb
            apps/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
