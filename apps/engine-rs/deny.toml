# Licence gate for the Auduio engine (run: cargo deny check licenses). Only permissive licences are allowed:
# no GPL/LGPL/AGPL and no commercial/proprietary terms (MPL-2.0 is file-level and used unmodified), so it can ship under Auduio's own terms.
# CI fails if a dependency brings in anything else.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Auduio's own crates (publish = false) are not third-party dependencies; their licence is the owner's choice (LICENSE)
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
# advisories need network access to the RustSec DB; licences are the hard gate here
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
