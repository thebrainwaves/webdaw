[package]
name = "auduio"
version = "0.5.1"
description = "Auduio - a recording machine for your computer"
authors = ["thebrainwaves"]
license = "LicenseRef-Auduio-Proprietary"  # proprietary, all rights reserved (see ../../LICENSE)
publish = false
edition = "2021"
rust-version = "1.77"

[lib]
name = "auduio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
